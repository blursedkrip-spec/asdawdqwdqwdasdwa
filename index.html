<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Monthsary ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --blush:#fdeff0; --blush2:#f8dfe4; --cream:#fffaf5;
  --rose:#d98aa0; --rose-d:#b8607b; --wine:#5a2a3c;
  --gold:#c9a26b; --sage:#a9bfa8;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);color:var(--wine);line-height:1.6;
  background:linear-gradient(180deg,var(--blush),var(--blush2)) fixed;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  overflow-x:hidden;
}
body.locked{overflow:hidden;height:100%}
h1,h2{font-family:var(--serif);font-style:italic;font-weight:600;line-height:1.1}

/* ---------- Intro ---------- */
.intro{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;text-align:center}
.intro h1{font-size:clamp(2.4rem,9vw,4.6rem);color:var(--rose-d)}
.intro .sub{margin-top:10px;color:var(--gold);font-family:var(--serif);font-style:italic;font-size:1.4rem}
.env{position:relative;width:min(320px,80vw);aspect-ratio:1.5;margin:44px auto 16px;border:0;background:none;cursor:pointer}
.env:focus-visible{outline:3px solid var(--gold);outline-offset:8px;border-radius:8px}
.env .back{position:absolute;inset:0;background:#e9a9ba;border-radius:10px;box-shadow:0 18px 40px rgba(184,96,123,.28)}
.env .card{position:absolute;left:8%;right:8%;top:8%;height:80%;background:var(--cream);border-radius:4px;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.env .front{position:absolute;inset:0;border-radius:10px;
  background:linear-gradient(135deg,#f3bccb 50%,transparent 50%) left/50% 100% no-repeat,
             linear-gradient(225deg,#f3bccb 50%,transparent 50%) right/50% 100% no-repeat,
             linear-gradient(0deg,#efaec0 45%,transparent 45%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:55%;background:var(--rose);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s ease}
.env .seal{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-size:1.5rem;z-index:2;box-shadow:0 4px 10px rgba(90,42,60,.25);transition:opacity .3s}
.hint{font-size:.95rem;color:var(--rose-d)}
.env.open .flap{transform:rotateX(180deg)}
.env.open .seal{opacity:0}
.env.open .card{transform:translateY(-70%)}
.env.open ~ .hint{visibility:hidden}

/* ---------- Story ---------- */
#story{display:none}
#story.show{display:block}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
section.phase{padding:72px 0 24px;text-align:center}
.tag{display:inline-block;padding:4px 16px;border-radius:999px;background:var(--cream);border:1px solid var(--gold);color:var(--gold);font-size:.9rem;font-weight:600}
section.phase h2{margin:14px 0 18px;font-size:clamp(2rem,7vw,3rem);color:var(--rose-d)}
.paper{position:relative;z-index:1;background:var(--cream);border-radius:18px;padding:32px 28px;box-shadow:0 14px 34px rgba(184,96,123,.16);border:1px solid #f4d9df}
.paper p{font-family:var(--serif);font-size:1.32rem;line-height:1.6;white-space:pre-line}
.counter{font-family:var(--serif);font-style:italic;font-size:1.7rem;color:var(--rose-d)}
.days{margin:2px 0 18px;font-size:.95rem;color:var(--gold);font-weight:600}
.sign{margin-top:18px;font-family:var(--serif);font-style:italic;font-size:1.5rem;text-align:right}
.divider{height:14px;margin:56px auto 0;max-width:220px;background:radial-gradient(circle at 7px 0,transparent 6px,var(--rose) 6.5px,var(--rose) 8px,transparent 8.5px) 0 0/14px 14px repeat-x;opacity:.55}
.list{list-style:none;padding:0;text-align:left}
.list li{font-family:var(--serif);font-size:1.3rem;padding:8px 0 8px 34px;position:relative}
.list li::before{content:"♥";position:absolute;left:4px;color:var(--rose)}
.reason{margin-top:8px;min-height:8em;font-family:var(--serif);font-style:italic;font-size:1.45rem;color:var(--rose-d)}
button.more, button.date-btn{margin-top:8px;padding:12px 24px;border-radius:999px;border:0;background:var(--rose);color:#fff;font:600 1rem var(--sans);cursor:pointer;box-shadow:0 8px 18px rgba(184,96,123,.3);transition:transform .15s}
button.more:hover, button.date-btn:hover{transform:translateY(-2px)}
button.more:focus-visible, button.date-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---------- Photo Frame Gallery ---------- */
.photo-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
  gap:18px;
  margin-bottom:24px;
  padding:10px 5px;
}
.frame{
  background:#fff;
  padding:10px 10px 22px 10px;
  border-radius:6px;
  box-shadow:0 8px 20px rgba(90,42,60,.12), 0 2px 6px rgba(0,0,0,.06);
  border:1px solid #f0d5dd;
  transition:transform .3s ease, box-shadow .3s ease;
  position:relative;
}
.frame:nth-child(odd){ transform:rotate(-2deg); }
.frame:nth-child(even){ transform:rotate(2deg); }
.frame:nth-child(3n){ transform:rotate(-3deg); }
.frame:nth-child(5n){ transform:rotate(3deg); }

.frame:hover{
  transform:scale(1.05) rotate(0deg)!important;
  z-index:5;
  box-shadow:0 14px 28px rgba(184,96,123,.28);
}
.frame img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:4px;
  display:block;
}
.frame::after{
  content:"♥";
  position:absolute;
  bottom:4px;
  right:10px;
  font-size:.8rem;
  color:var(--rose);
}

/* ---------- Date Invitation Card ---------- */
.date-card {
  background: linear-gradient(135deg, var(--cream) 0%, #fff0f3 100%);
  border: 2px dashed var(--rose);
  border-radius: 20px;
  padding: 36px 28px;
  box-shadow: 0 16px 36px rgba(184,96,123,.18);
  position: relative;
}
.date-card p {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.45rem;
  line-height: 1.7;
  color: var(--wine);
}
.date-badge {
  display: inline-block;
  background: var(--rose-d);
  color: #fff;
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.3rem;
  padding: 6px 22px;
  border-radius: 999px;
  margin: 18px 0;
  box-shadow: 0 4px 12px rgba(184,96,123,.3);
}
.date-actions {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 20px;
  flex-wrap: wrap;
}
button.btn-yes {
  background: var(--rose-d);
}
button.btn-no {
  background: transparent;
  border: 1px solid var(--rose);
  color: var(--rose-d);
  box-shadow: none;
}
#date-response {
  margin-top: 18px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.5rem;
  color: var(--rose-d);
}

/* side decorations */
section.phase{position:relative}
.decor{position:absolute;top:50%;width:130px;z-index:0;pointer-events:none;opacity:0;
  --dx:40px;--y:-50%;transform:translate(var(--dx),var(--y)) scale(.85);
  transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
.decor.right{right:-165px}
.decor.left{left:-165px;--dx:-40px}
.decor.in{opacity:1;transform:translate(0,var(--y)) scale(1)}
.decor svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 100%}
.decor.in svg{animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@media (max-width:980px){
  .decor{width:84px;top:auto;bottom:-34px;--y:0px;z-index:2}
  .decor.right{right:-6px}
  .decor.left{left:-6px}
}

/* floating hearts */
.heart-symbol{
  position:fixed;
  bottom:-30px;
  pointer-events:none;
  animation:rise linear forwards;
  z-index:5;
  color: var(--rose);
  font-size: 20px;
}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .heart-symbol{display:none}.reveal{opacity:1;transform:none}
  .decor{opacity:1;transform:translate(0,var(--y))}
}
footer{padding:64px 20px 90px;text-align:center;font-family:var(--serif);font-style:italic;font-size:1.5rem;color:var(--rose-d)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}
</style>
</head>
<body class="locked">

<header class="intro" id="intro">
  <h1 id="title"></h1>
  <p class="sub">I made you something.</p>
  <button class="env" id="env" aria-label="Open the letter">
    <span class="back"></span><span class="card"></span><span class="front"></span><span class="flap"></span><span class="seal">♥</span>
  </button>
  <p class="hint">Tap the envelope</p>
</header>

<main id="story"><div class="wrap" id="phases"></div></main>
<footer id="foot" hidden></footer>

<script>
/* ✏️ CONFIGURATION ✏️ */
const CONFIG = {
  herName: "Meng",
  yourName: "Your Name",
  startDate: "2026-01-29",      // YYYY-MM-DD
  months: 8,
  closing: "Happy 8th monthsary, Meng. I love you, always ♥",

  phases: [
    { 
      type: "letter", 
      tag: "Chapter 1", 
      title: "A little note",
      text: "Happy 8th monthsary, Meng!\n\nEight months, and every one of them has made my life softer, warmer and happier. Thank you for staying, for understanding me, and for choosing me again and again.\n\nI'm so proud of us, and I can't wait for all the months still to come." 
    },

    { 
      type: "text", 
      tag: "Chapter 2", 
      title: "How it started",
      text: "I still remember the first time we talked. I didn't know then how much you would mean to me." 
    },

    { 
      type: "gallery", 
      tag: "Chapter 3", 
      title: "My favorite memory",
      photos: [
        "image1.jpeg", "image2.jpeg", "image3.jpeg", "image4.jpeg",
        "image5.jpeg", "image6.jpeg", "image7.jpeg", "image8.jpeg",
        "image9.jpeg", "image10.jpeg", "image11.jpeg", "image12.jpeg"
      ],
      text: "My favorite memory of us is everytime we travel and go different places, going on dates and spending quality time with each other. Kahit na antataba na natin at nauubos na pera natin hahahaha, di ko yon ipagpapalit sa kahit anong bagay dahil sa tuwing kasama kita, don ko nararamdaman kung gaano kasarap sa buhay na merong ikaw." 
    },

    { 
      type: "text", 
      tag: "Chapter 4", 
      title: "The thing I love most about you",
      text: "Everything. I love everything about you, even your flaws and imperfections, because all of it makes you who you are as a person.\n\nSo don't ever think less of yourself, even on your worst days, because I am the prime example of how lovable you are, even if you think you are not." 
    },

    { 
      type: "reasons", 
      tag: "Chapter 5", 
      title: "Why I love you",
      items: [
        "I love how gentle your heart is. You care so deeply, and even when the world is heavy, you still choose kindness.",
        "With you I never have to pretend. You've seen my weak days and my messy days, and you stayed. That is the safest feeling I know.",
        "You make me want to be better, not because you ask me to, but because you make me believe I can.",
        "Even on tiring days, just hearing your voice makes everything feel lighter. You are my calm.",
        "I love how you love: quietly, sincerely, and with your whole heart. It has changed the way I see love.",
        "You are the reason I believe in good things again. With you, I'm not afraid of the future, I'm excited for it."
      ] 
    },

    {
      type: "date_invite",
      tag: "A Special Question",
      title: "Will you go on a date with me?",
      text: "I want to create more memories with you and spend quality time together. Can I take you out on a date?",
      dateStr: "October 3, 2026"
    }
  ]
};
/* ---------------------------------- */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ordinal = n => { const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
const days = Math.max(0, Math.floor((Date.now() - new Date(CONFIG.startDate + "T00:00:00")) / 864e5));

$("title").textContent = `Happy ${ordinal(CONFIG.months)} Monthsary, ${CONFIG.herName}`;

/* ---------- SVG Illustrations ---------- */
const G="#9fbb9b", LEAF="#b5cdb0", WINE="#5a2a3c", GOLD="#c9a26b";
const P=(d,f,s="none",w=0)=>`<path d="${d}" fill="${f}" stroke="${s}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const stem=d=>P(d,"none",G,4);
const leaf=d=>P(d,LEAF);
const spark=(x,y,s)=>P(`M${x} ${y-s}Q${x} ${y} ${x+s} ${y}Q${x} ${y} ${x} ${y+s}Q${x} ${y} ${x-s} ${y}Q${x} ${y} ${x} ${y-s}Z`,GOLD);
const tulip=(x,y,s,c,d)=>`<g transform="translate(${x} ${y}) scale(${s})">${P("M-18 0C-22-28-14-46 0-52C14-46 22-28 18 0C10 10-10 10-18 0Z",c,d,1.6)}${P("M0-52C-6-30-6-10 0 8","none",d,1.4)}</g>`;
const rose=(x,y,r,c,d)=>`<g transform="translate(${x} ${y})"><circle r="${r}" fill="${c}" stroke="${d}" stroke-width="1.5"/><circle r="${r*.7}" fill="${c}" stroke="${d}" stroke-width="1.3"/><path d="M${-r*.4} ${r*.1}a${r*.4} ${r*.4} 0 1 1 ${r*.45} ${r*.3}" fill="none" stroke="${d}" stroke-width="1.5" stroke-linecap="round"/><circle r="${r*.22}" fill="${d}" opacity=".3"/></g>`;
const lily=(x,y,s,c,d)=>{let p="";for(let a=30;a<390;a+=60)p+=`<g transform="rotate(${a})"><ellipse cy="${-s*.5}" rx="${s*.2}" ry="${s*.5}" fill="${c}" stroke="${d}" stroke-width="1.3"/><path d="M0 0V${-s*.8}" stroke="${d}" stroke-width="1" opacity=".6"/></g>`;
  for(let a=0;a<360;a+=120)p+=`<g transform="rotate(${a+15})"><path d="M0 0V${-s*.5}" stroke="${GOLD}" stroke-width="1.5"/><circle cy="${-s*.5}" r="2.6" fill="${GOLD}"/></g>`;
  return `<g transform="translate(${x} ${y})">${p}</g>`;};
const svg=(vb,inner)=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

const ART={
  tulips: svg("0 0 140 220",
    stem("M70 215V100")+stem("M38 215C38 170 40 140 40 118")+stem("M102 215C102 170 100 140 100 118")+
    leaf("M70 215C45 195 36 170 38 148C58 160 68 185 70 215Z")+leaf("M70 215C95 195 104 170 102 148C82 160 72 185 70 215Z")+
    tulip(70,100,1.15,"#f4a9be","#e07d9c")+tulip(40,120,.85,"#fffafa","#eab6c4")+tulip(100,120,.85,"#f7c1d0","#e58aa5")+
    spark(20,60,8)+spark(124,80,6)),

  matcha: svg("0 0 120 200",
    P("M74 46L88 8","none","#f4a9be",6)+
    P("M26.2 130H93.8L90 180H30Z","#e8607f")+
    P("M23.5 95H96.5L93.8 130H26.2Z","#fff3ee")+
    P("M20.8 60H99.2L96.5 95H23.5Z","#9dbd6a")+
    `<rect x="34" y="66" width="16" height="16" rx="4" fill="#fff" opacity=".45" transform="rotate(-12 42 74)"/><rect x="62" y="72" width="14" height="14" rx="4" fill="#fff" opacity=".4" transform="rotate(10 69 79)"/>`+
    P("M20 50L30 180Q30 186 36 186H84Q90 186 90 180L100 50Z","none","#d9b8c2",2.5)+
    `<rect x="15" y="42" width="90" height="10" rx="5" fill="#fffaf5" stroke="#d9b8c2" stroke-width="2"/>`+
    `<circle cx="48" cy="112" r="2.6" fill="${WINE}"/><circle cx="72" cy="112" r="2.6" fill="${WINE}"/>`+
    P("M54 117Q60 123 66 117","none",WINE,2)+
    `<circle cx="41" cy="118" r="5" fill="#f4a9be" opacity=".6"/><circle cx="79" cy="118" r="5" fill="#f4a9be" opacity=".6"/>`+
    spark(10,30,8)+spark(112,120,6)),

  roses: svg("0 0 140 220",
    stem("M72 215V96")+stem("M40 215C42 180 40 150 38 142")+stem("M104 215C102 185 104 160 104 144")+
    leaf("M72 200C48 190 40 172 44 158C62 166 70 182 72 200Z")+leaf("M72 190C96 182 106 166 102 152C84 158 74 172 72 190Z")+
    rose(72,70,30,"#f4a9be","#e07d9c")+rose(38,120,24,"#fffafa","#e3b3c0")+rose(104,122,22,"#f7c1d0","#e58aa5")+
    spark(122,60,7)+spark(14,70,6)),

  fudge: svg("0 0 140 140",
    `<g transform="rotate(-22 70 70)">`+
    `<rect x="14" y="44" width="112" height="52" rx="14" fill="#5b3325"/>`+
    `<rect x="52" y="50" width="68" height="14" rx="6" fill="#7d4b31"/><rect x="52" y="64" width="68" height="9" fill="#fff0e2"/><rect x="52" y="73" width="68" height="17" rx="6" fill="#7d4b31"/>`+
    P("M22 40H54L48 51L54 62L48 73L54 84L48 100H22Q10 100 10 88V52Q10 40 22 40Z","#f4a9be","#e07d9c",1.5)+
    P("M32 82C21 74 21 64 28 64C30 64 32 66 32 68C32 66 34 64 36 64C43 64 43 74 32 82Z","#fff")+
    `</g>`+spark(20,30,8)+spark(120,112,7)),

  lilies: svg("0 0 140 220",
    stem("M70 215V110")+stem("M38 215C40 180 42 150 40 130")+stem("M102 215C100 180 98 150 100 132")+
    leaf("M70 210C46 196 36 176 40 160C58 168 68 188 70 210Z")+leaf("M70 200C94 190 104 174 100 160C84 166 72 180 70 200Z")+
    lily(70,92,44,"#f8c2d3","#e58aa5")+lily(38,122,30,"#fbd3df","#e58aa5")+lily(102,124,30,"#f6b3c8","#e07d9c")+
    spark(122,60,7)+spark(16,60,6))
};
const KINDS=Object.keys(ART);

function render(p, i){
  const kind = p.decor || KINDS[i % KINDS.length];
  const dec = ART[kind] ? `<div class="decor ${i%2 ? 'left' : 'right'}" aria-hidden="true">${ART[kind]}</div>` : "";
  let body = "";

  if (p.type === "letter") {
    body = `<div class="paper">
      <p class="counter">${CONFIG.months} ${CONFIG.months===1?"month":"months"} of us</p>
      <p class="days">${days} days and counting</p>
      <p>${esc(p.text)}</p><p class="sign">— ${esc(CONFIG.yourName)}</p></div>`;
  } else if (p.type === "gallery") {
    const grid = `<div class="photo-grid">${p.photos.map(src=>`<div class="frame"><img src="${esc(src)}" alt="Memory"></div>`).join("")}</div>`;
    body = `<div class="paper">${grid}<p>${esc(p.text)}</p></div>`;
  } else if (p.type === "list") {
    body = `<div class="paper"><ul class="list">${p.items.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`;
  } else if (p.type === "reasons") {
    body = `<div class="reason" id="reason-${i}" aria-live="polite">Tap the button ♥</div>
            <button class="more" data-i="${i}">Another reason why</button>`;
  } else if (p.type === "date_invite") {
    body = `<div class="date-card">
              <p>${esc(p.text)}</p>
              <div class="date-badge">♥ ${esc(p.dateStr)} ♥</div>
              <div class="date-actions">
                <button class="date-btn btn-yes" id="btn-date-yes">Yes, I'd love to!</button>
                <button class="date-btn btn-no" id="btn-date-no">Of course Yes!</button>
              </div>
              <div id="date-response"></div>
            </div>`;
  } else {
    body = `<div class="paper"><p>${esc(p.text)}</p></div>`;
  }

  return `<section class="phase reveal">${dec}
    <span class="tag">${esc(p.tag||"")}</span><h2>${esc(p.title||"")}</h2>${body}
    ${i < CONFIG.phases.length-1 ? '<div class="divider"></div>' : ''}</section>`;
}

$("phases").innerHTML = CONFIG.phases.map(render).join("");
$("foot").textContent = CONFIG.closing;

function hearts(n){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const symbols = ["♥", "♡", "❥", "❣"];
  for (let i=0;i<n;i++){
    const h=document.createElement("span");
    h.className="heart-symbol"; 
    h.textContent=symbols[i % symbols.length];
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(16+Math.random()*22)+"px";
    h.style.animationDuration=(4+Math.random()*4)+"s";
    h.style.animationDelay=(Math.random()*1.5)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),10000);
  }
}

const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }), {threshold:.15});

$("env").addEventListener("click", e => {
  const env = e.currentTarget;
  if (env.classList.contains("open")) return;
  env.classList.add("open");
  env.setAttribute("aria-label","Letter opened");
  hearts(22);
  setTimeout(() => {
    document.body.classList.remove("locked");
    $("story").classList.add("show");
    $("foot").hidden = false;
    document.querySelectorAll(".reveal, .decor").forEach(el => io.observe(el));
    $("story").scrollIntoView({behavior:"smooth"});
  }, 1000);
});

const last = {};
document.addEventListener("click", e => {
  const b = e.target.closest("button.more"); 
  if (b) {
    const i = +b.dataset.i, items = CONFIG.phases[i].items;
    let k; do { k = Math.floor(Math.random()*items.length); } while (k===last[i] && items.length>1);
    last[i] = k; $("reason-"+i).textContent = items[k]; hearts(6);
    return;
  }

  if (e.target.id === "btn-date-yes" || e.target.id === "btn-date-no") {
    $("date-response").textContent = "It's a date! See you on October 3, 2026 ♥";
    hearts(25);
    e.target.parentElement.style.display = "none";
  }
});
</script>
</body>
</html>
